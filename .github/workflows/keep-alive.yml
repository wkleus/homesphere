name: Keep Render Alive

# prevent Render backend from going to sleep (= cold starts) by pinging API endpoint regularly

on:
  schedule:
    - cron: "*/10 * * * *" # run every 10 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -I -L --fail --retry 3 --retry-delay 5 \
            https://homesphere-kifc.onrender.com/api/entries \
            || true


